services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ai_learn_os
      POSTGRES_USER: ai_learn
      POSTGRES_PASSWORD: ai_learn_local
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docs/database.sql:/docker-entrypoint-initdb.d/001_ai_learn_os.sql:ro

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
