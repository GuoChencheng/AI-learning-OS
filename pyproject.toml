[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-learning-os"
version = "0.1.0"
description = "Web-first AI Learn OS for ChatGPT-style learning workflows."
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
keywords = ["learning", "cli", "local-first", "ai", "education"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: FastAPI",
  "Framework :: Pydantic",
  "Intended Audience :: Education",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Education",
]
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "pypdf>=5",
  "typer>=0.12",
  "pydantic>=2",
  "PyYAML>=6",
  "python-frontmatter>=1",
  "rich>=13",
  "sqlalchemy>=2",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
learn = "ailearn.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
